  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0
  web_socket_channel: ^3.0.1
  uuid: ^4.5.1
  firebase_core: ^3.9.0
  firebase_messaging: ^15.1.6
  flutter_webrtc: ^0.12.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
