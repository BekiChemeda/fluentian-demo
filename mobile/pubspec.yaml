name: fluentian_mobile
description: Fluentian MVP mobile app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.2.0
  flutter_staggered_animations: ^1.1.1
  confetti: ^0.8.0
  percent_indicator: ^4.2.5
